<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossFit Phase 1 Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans p-4 max-w-2xl mx-auto">

  <header class="mb-6 flex justify-between items-center border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400" id="day-title">Day 1</h1>
      <p class="text-sm text-gray-400" id="workout-meta">12 exercises • ~26 min</p>
    </div>
    <select id="day-select" class="bg-gray-800 border border-gray-700 text-white rounded px-3 py-1 focus:outline-none">
      <option value="Day 1">Day 1</option>
      <option value="Day 2">Day 2</option>
      <option value="Day 3">Day 3</option>
    </select>
  </header>

  <div id="workout-container" class="space-y-6"></div>

  <div id="video-modal" class="fixed inset-0 bg-black/80 hidden justify-center items-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-xl max-w-lg w-full p-4 relative">
      <button onclick="closeModal()" class="absolute top-2 right-3 text-gray-400 hover:text-white text-xl">&times;</button>
      <h3 id="modal-title" class="text-lg font-bold mb-2">Exercise Video</h3>
      <div class="aspect-video w-full mb-3">
        <iframe id="modal-iframe" class="w-full h-full rounded" src="" frameborder="0" allowfullscreen></iframe>
      </div>
      <p id="modal-desc" class="text-sm text-gray-300"></p>
    </div>
  </div>

  <script src="workout-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
